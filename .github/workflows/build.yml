name: Build upstream releases

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many of the newest releases to consider, or 'taste' to thin the whole history toward the past"
        required: false
        default: "6"

permissions:
  contents: write
  pages: write

concurrency: build

env:
  UP: tangency-labs/fieldcraft
  APP: fieldcraft
  WEBDIR: apps/fieldcraft-web
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TRUNK_VERSION: v0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Find releases we don't have yet
        run: |
          : > todo.txt
          if [ "${{ inputs.limit || '6' }}" = taste ]; then
            # Thin the history toward the past (see scripts/pick.py) instead of a hard cutoff.
            tags=$(gh release list -R "$UP" --limit 400 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt | python3 scripts/pick.py)
          else
            tags=$(gh release list -R "$UP" --limit "${{ inputs.limit || '6' }}" --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          fi
          for tag in $tags; do
            [ -d "v${tag#v}" ] || echo "$tag" >> todo.txt
          done
          cat todo.txt
          if [ -s todo.txt ]; then echo "NEED=true" >> "$GITHUB_ENV"; fi

      - uses: dtolnay/rust-toolchain@stable
        if: env.NEED == 'true'
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        if: env.NEED == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin"
          rm trunk.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build each new release
        if: env.NEED == 'true'
        run: |
          while read -r tag; do
            ver="${tag#v}"
            echo "::group::Build $tag"
            rm -rf up out
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/$UP.git" up
            if (cd "up/$WEBDIR" && trunk build --release --public-url ./ --dist "$GITHUB_WORKSPACE/out"); then
              mkdir "v$ver"
              cp -a out/. "v$ver/"
              cp up/LICENSE* "v$ver/" 2>/dev/null || true
              printf 'Built from %s at tag %s\nhttps://github.com/%s/tree/%s\n' "$UP" "$tag" "$UP" "$tag" > "v$ver/SOURCE.txt"
            else
              echo "::warning::build failed for $tag"
            fi
            rm -rf up out
            echo "::endgroup::"
          done < todo.txt

      - name: Record versions that could not be hosted
        run: bash scripts/skip.sh sync todo.txt

      - name: Update latest and versions.json
        run: |
          versions=$(find . -maxdepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sed 's/^v//' | sort -rV)
          [ -n "$versions" ] || { echo "No versions built"; exit 0; }
          latest=$(echo "$versions" | head -n1)
          mkdir -p latest
          printf '<!doctype html><meta charset="utf-8"><title>%s</title><meta http-equiv="refresh" content="0; url=../v%s/"><link rel="canonical" href="../v%s/"><a href="../v%s/">Open %s %s</a>\n' "$APP" "$latest" "$latest" "$latest" "$APP" "$latest" > latest/index.html
          echo "$versions" | jq -R . | jq -s --arg latest "$latest" '{latest: $latest, versions: .}' > versions.json
          cat versions.json

      - name: Keep the site under its size cap
        run: bash scripts/prune.sh

      - name: Commit and request a Pages build
        run: |
          rm -f todo.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add upstream release builds"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
